# fly.toml app configuration file generated for stop-cards on 2026-10-27T10:44:45+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'stop-cards'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[deploy]
  release_command = "node server.js"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024